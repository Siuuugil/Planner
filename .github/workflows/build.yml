# 코드를 올리면 자동으로:
#  1) 검사·테스트
#  2) Windows(.zip), Android(.apk), 웹 빌드
#  3) 기본 브랜치면 "latest" 릴리스에 설치 파일 업데이트
#  4) 기본 브랜치면 웹 버전을 GitHub Pages에 배포
name: build

on:
  push:
    paths-ignore: ['**.md', 'supabase/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # 매번 같은 키로 서명해야 폰에서 덮어쓰기 업데이트가 된다.
      - run: mkdir -p ~/.android && cp android/ci-debug.keystore ~/.android/debug.keystore
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk MyPlanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MyPlanner.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MyPlanner-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MyPlanner-windows.zip

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # GitHub Pages 주소가 https://<계정>.github.io/<레포이름>/ 이므로 base href를 맞춘다.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    needs: web
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [android, windows]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: latest 태그를 이번 커밋으로 이동
        run: |
          git tag -f latest
          git push -f origin latest
      - name: 이전 설치 파일 정리
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view latest --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset latest "$a" -y
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 빌드
          prerelease: false
          make_latest: true
          body: |
            커밋 ${{ github.sha }} 기준 자동 빌드 (#${{ github.run_number }})

            - **PC (Windows)**: `MyPlanner-windows.zip` 받아서 압축 풀고 `my_planner.exe` 실행
            - **Android**: `MyPlanner.apk` 받아서 설치 (출처를 알 수 없는 앱 허용 필요)
          files: |
            dist/MyPlanner.apk
            dist/MyPlanner-windows.zip
