# Supabase 무료 플랜은 1주일 동안 요청이 없으면 프로젝트를 일시정지한다.
# 주 2회 가벼운 조회를 보내 멈추지 않게 한다 (공개용 publishable 키, 데이터는 RLS로 막혀 빈 결과).
name: supabase-keepalive

on:
  schedule:
    - cron: '17 3 * * 1,4'   # 월·목 12:17 KST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase REST 조회
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://edykgbaqmlmmmgwwgqtb.supabase.co/rest/v1/items?select=id&limit=1' \
            -H 'apikey: sb_publishable_S6pR80hHvWnppfE4nIO88A_t1SdiOfv')
          echo "status $code"
          test "$code" = 200
